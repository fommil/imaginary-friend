build:
  image: ensime/ensime:v2.x
  pull: true
  commands:
    - git log | head -n 20
    - sbt ++$SCALA_VERSION clean test:compile it:compile doc ;
      if [ $(git diff | wc -l) -ge 1 ] ; then
        echo "Code formatting does not meet the project's standards:" ;
        git --no-pager diff ;
        exit 1 ;
      fi
    - sbt ++$SCALA_VERSION plugin/test

matrix:
  SCALA_VERSION:
    - 2.10.6
    - 2.11.7
